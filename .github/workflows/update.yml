name: update
# Every four hours (the hub's tic-dispatch Worker, at :45 past 01, 05, 09, 13, 17 and 21 UTC), on every push to main,
# by hand, and on its own 6-hourly cron as a fallback: the tests, a live collection (IODA, OONI, the provider watch:
# IODA on watched ASNs and provider status feeds, Cloudflare Radar outages and BGP, the IAEA's Zaporizhzhia updates,
# Access Now's STOP sheet, ODIN's US county outages, NASA Black Marble night lights, suite tips from COP),
# the site build and feed check, then a deploy of site/ to Cloudflare Pages (project blackout). Needs repo secrets
# secret CLOUDFLARE_PAGES_TOKEN (Cloudflare Pages: Edit) and the account ID (repo variable CLOUDFLARE_ACCOUNT_ID, set
# 12 Nov 2026; a secret of that name also works); without them everything runs except the deploy. Collected data is not committed: the repo keeps the seed build (status test), and each deploy carries that
# run's live data. A seed feed is never deployed.
#
# The clock: GitHub fires schedules late (every 4-9 h in Nov 2026), so the hub's tic-dispatch Worker starts this
# workflow (theintelligence-company dispatch/dispatch.js; needs blackout in DISPATCH_TOKEN's repository access).
# One job per run keeps the private repo's Actions minutes low.
#
# History (feed contract revision 2.1, 18 Nov 2026): after the check, the kit's history log (tic-history/1) logs what
# changed since the last run under each item's subject_id, fills last_change on items that do not state it, writes
# site/data/ended.geojson, and, after the deploy, commits history/ to main. That log is the one live data this repo
# keeps (the full items as published), plus the retention archives of `tools/blackout.py archive` (night-light readings,
# ODIN county rows, Bluesky counts, GDELT file reductions). A push with the workflow token starts no run. A failed history step never
# stops the deploy; a failed deploy leaves history/ uncommitted, and the next run logs the same changes again.
#
# Private archive (secret TIC_ARCHIVE_TOKEN): every run's data/ (the run snapshot and the carries), the deployed
# site/ and history/ also go to the PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is
# replaced or deleted. data/ is otherwise never kept (each run rebuilds it), site/ is replaced by the next deploy
# (site/data/ended.geojson among it, rewritten each run), and history/ is the public log; the archive keeps every
# version. The data/ and site/ lanes run straight after the deploy, history/ after its commit.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write     # the history/ commit
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: h5py for Black Marble's HDF5 (Blackout's one dependency; Tom, 13 Nov 2026)
        run: python -m pip install --disable-pip-version-check "h5py==3.16.0"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Live collection (never falls back to seed; a failed source is listed on the page)
        id: collect
        run: python tools/blackout.py collect --live
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}  # Black Marble; expires every 60 days
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}  # EIA-930
      - name: Build site/
        run: python tools/blackout.py build
      - name: Feed check
        run: python tools/blackout.py check
      - name: Never deploy seed data
        run: |
          python -c "import json, sys; m = json.load(open('site/data/feed.geojson', encoding='utf-8'))['mode']; sys.exit(0 if m == 'live' else 'feed mode is ' + m + ', not live')"
      - name: History (history/, last_change on the feed, and site/data/ended.geojson)
        id: history
        run: |
          git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- history 2>/dev/null \
            || echo "::warning::no history/ on main's tip yet (first run) or not read; using this checkout's"
          python doctrine/kit/tic.py history site/data/feed.geojson --dir history --ended site/data/ended.geojson \
            --fill-last-change \
            || echo "::warning::history step failed; this run is missing from history/"
      - name: Feed check again, after last_change was filled
        run: python tools/blackout.py check
      - name: Deploy site/ to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          npx --yes wrangler@4.151.3 pages deploy site --project-name blackout --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true
          echo "deployed=true" >> "$GITHUB_OUTPUT"   # only after wrangler succeeded: the skip above also ends green
      # What this public repository never keeps or replaces each run, to the PRIVATE archive, one lane each (release
      # blackout-<lane>-YYYY-MM; a snapshot per run, only changed files uploaded, nothing replaced). Straight after
      # the deploy, before the steps below call gh and git, so a later step that hangs cannot take these with it.
      #   state  data/ without data/private (lane netblocks, below): the run snapshot, the carries the next run reads
      #          back from the live site (EIA hours, GDELT counts, trends, NetBlocks' parsed posts), the GDELT files
      #          read this run and this run's NetBlocks posts with their excerpts. Never committed: each run rebuilds
      #          data/. Only once the live collection finished, so it is never a seed build or half a run.
      #   site   site/ as deployed: every published file, feed.geojson and ended.geojson (COP) among them, each
      #          replaced by the next deploy. Only when wrangler deployed it (the deploy step's output `deployed`):
      #          without the Cloudflare secrets the deploy step skips itself and still succeeds.
      # Nothing is redacted: no key is ever written to data/ or site/, and site/ is public already, so it matches the
      # public copy by hash. Each lane is tried even if the other failed; a failure turns the run red after the
      # deploy, and the steps below still run.
      - name: Private archive (run snapshot and site, to tic-archive)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          COLLECTED: ${{ steps.collect.outcome }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so data/ and site/ did not reach the private archive"; exit 1
          fi
          failed=0
          if [ "$COLLECTED" = "success" ]; then
            python tools/tic_archive.py put --program blackout --lane state --src data --exclude 'private/*' || failed=1
          else
            echo "state: the live collection did not finish this run, so data/ was not archived"
          fi
          if [ "$DEPLOYED" = "true" ]; then
            python tools/tic_archive.py put --program blackout --lane site --src site || failed=1
          else
            echo "site: not deployed this run (the deploy failed or was skipped), so not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
      # Retention archives (18 Nov 2026; blackout/archive.py): the Black Marble nights, ODIN county rows, Bluesky counts and
      # GDELT file reductions the live view drops or overwrites, appended to history/. After the deploy, so a failure
      # here never blocks the site; it fails this job loudly (red), and the commit step below still keeps what the
      # other history files gained, because each archive is tried even when another fails.
      - name: Archive what the live view drops (history/blackmarble-nights, odin, public-counts, gdelt-matches)
        id: archive
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 3   # a hung gh call fails this step; the steps after it still run
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}   # contents:write on the private tic-archive only
        run: |
          rc=0
          python tools/blackout.py archive || rc=1
          # NetBlocks' posts with their excerpts (24 Nov 2026): never archived in this public repo (all rights
          # reserved). The one append-only file lives in the PRIVATE repo metacog-osint/tic-archive (lane
          # blackout-netblocks): restored, appended to, uploaded again. history/ keeps netblocks-index.jsonl (time,
          # link, parsed fields). The old public history/netblocks-posts.jsonl is folded in and removed
          # (retire-legacy) only after the upload succeeded, so the commit step below drops it from main's tip; git
          # history keeps its past versions. A failure leaves the public file in place and turns this job red.
          rm -rf data/private && mkdir -p data/private/netblocks
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so NetBlocks' posts were not archived privately"; rc=1
          elif python tools/tic_archive.py restore --program blackout --lane netblocks --dest data/private/netblocks \
            && python tools/blackout.py archive-full --dir data/private/netblocks \
            && python tools/tic_archive.py put --program blackout --lane netblocks --src data/private/netblocks \
            && python tools/blackout.py retire-legacy --dir data/private/netblocks; then
            echo "NetBlocks: posts with excerpts are in the private archive"
          else
            echo "::error::NetBlocks' posts did not reach the private archive this run; the next run retries"; rc=1
          fi
          exit $rc
      - name: Commit history/ (after the deploy, so the log never runs ahead of the published feed)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          [ -d history ] || { echo "no history/ this run"; exit 0; }
          git config user.name "blackout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            git add history
            git diff --cached --quiet -- history && { echo "history: nothing new"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
      # history/ to the same private archive (lane history), as the History step and the retention archives left it:
      # the kit's history log and state.json and the append-only retention files. Committed to main too. Only when
      # the History step ran, so a run that stopped earlier never archives an older checkout's history/ as the newest
      # snapshot. When the deploy or every push failed, the snapshot holds this run's history/, which main never got;
      # the next run logs the same changes again from main's tip, with its own times. So the newest snapshot can hold
      # lines that were never public, and it is the only copy of this run's times. Archived as it is (public files),
      # so it matches the public copy by hash.
      - name: Private archive (history, to tic-archive)
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          HISTORY: ${{ steps.history.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so history/ did not reach the private archive"; exit 1
          fi
          if [ "$HISTORY" = "success" ]; then
            python tools/tic_archive.py put --program blackout --lane history --src history
          else
            echo "history: the History step did not run, so history/ was not archived"
          fi
