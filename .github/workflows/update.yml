name: update
# Every four hours (the hub's tic-dispatch Worker, at :45 past 01, 05, 09, 13, 17 and 21 UTC), on every push to main,
# by hand, and on its own 6-hourly cron as a fallback: the tests, a live collection (IODA, OONI, the provider watch:
# IODA on watched ASNs and provider status feeds, Cloudflare Radar outages and BGP, the IAEA's Zaporizhzhia updates,
# Access Now's STOP sheet, ODIN's US county outages, NASA Black Marble night lights, suite tips from COP),
# the site build and feed check, then a deploy of site/ to Cloudflare Pages (project blackout). Needs repo secrets
# secret CLOUDFLARE_PAGES_TOKEN (Cloudflare Pages: Edit) and the account ID (repo variable CLOUDFLARE_ACCOUNT_ID, set
# 12 Nov 2026; a secret of that name also works); without them everything runs except the deploy. Collected data is not committed: the repo keeps the seed build (status test), and each deploy carries that
# run's live data. A seed feed is never deployed.
#
# The clock: GitHub fires schedules late (every 4-9 h in Nov 2026), so the hub's tic-dispatch Worker starts this
# workflow (theintelligence-company dispatch/dispatch.js; needs blackout in DISPATCH_TOKEN's repository access).
# One job per run keeps the private repo's Actions minutes low.
#
# History (feed contract revision 2.1, 18 Nov 2026): after the check, the kit's history log (tic-history/1) logs what
# changed since the last run under each item's subject_id, fills last_change on items that do not state it, writes
# site/data/ended.geojson, and, after the deploy, commits history/ to main. That log is the one live data this repo
# keeps (the full items as published). A push with the workflow token starts no run. A failed history step never
# stops the deploy; a failed deploy leaves history/ uncommitted, and the next run logs the same changes again.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write     # the history/ commit
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: h5py for Black Marble's HDF5 (Blackout's one dependency; Tom, 13 Nov 2026)
        run: python -m pip install --disable-pip-version-check "h5py==3.16.0"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Live collection (never falls back to seed; a failed source is listed on the page)
        run: python tools/blackout.py collect --live
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}  # Black Marble; expires every 60 days
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}  # EIA-930
      - name: Build site/
        run: python tools/blackout.py build
      - name: Feed check
        run: python tools/blackout.py check
      - name: Never deploy seed data
        run: |
          python -c "import json, sys; m = json.load(open('site/data/feed.geojson', encoding='utf-8'))['mode']; sys.exit(0 if m == 'live' else 'feed mode is ' + m + ', not live')"
      - name: History (history/, last_change on the feed, and site/data/ended.geojson)
        run: |
          git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- history 2>/dev/null \
            || echo "::warning::no history/ on main's tip yet (first run) or not read; using this checkout's"
          # --now is the feed's own generated_at: a change stamped later than the items' published_at fails the
          # check below (18 Nov 2026: two new items stopped every deploy until this)
          python doctrine/kit/tic.py history site/data/feed.geojson --dir history --ended site/data/ended.geojson \
            --fill-last-change \
            --now "$(python -c "import json; print(json.load(open('site/data/feed.geojson', encoding='utf-8'))['generated_at'])")" \
            || echo "::warning::history step failed; this run is missing from history/"
      - name: Feed check again, after last_change was filled
        run: python tools/blackout.py check
      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          npx --yes wrangler@4.151.3 pages deploy site --project-name blackout --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true
      - name: Commit history/ (after the deploy, so the log never runs ahead of the published feed)
        run: |
          [ -d history ] || { echo "no history/ this run"; exit 0; }
          git config user.name "blackout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            git add history
            git diff --cached --quiet -- history && { echo "history: nothing new"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
