name: update
# Every four hours (the hub's tic-dispatch Worker, at :45 past 01, 05, 09, 13, 17 and 21 UTC), on every push to main,
# by hand, and on its own 6-hourly cron as a fallback: the tests, a live collection (IODA, OONI, the provider watch:
# IODA on watched ASNs and provider status feeds, suite tips from COP),
# the site build and feed check, then a deploy of site/ to Cloudflare Pages (project blackout). Needs repo secrets
# secret CLOUDFLARE_PAGES_TOKEN (Cloudflare Pages: Edit) and the account ID (repo variable CLOUDFLARE_ACCOUNT_ID, set
# 12 Nov 2026; a secret of that name also works); without them everything runs except the deploy. Collected data is not committed: the repo keeps the seed build (status test), and each deploy carries that
# run's live data. A seed feed is never deployed.
#
# The clock: GitHub fires schedules late (every 4-9 h in Nov 2026), so the hub's tic-dispatch Worker starts this
# workflow (theintelligence-company dispatch/dispatch.js; needs blackout in DISPATCH_TOKEN's repository access).
# One job per run keeps the private repo's Actions minutes low.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Live collection (never falls back to seed; a failed source is listed on the page)
        run: python tools/blackout.py collect --live
      - name: Build site/
        run: python tools/blackout.py build
      - name: Feed check
        run: python tools/blackout.py check
      - name: Never deploy seed data
        run: |
          python -c "import json, sys; m = json.load(open('site/data/feed.geojson', encoding='utf-8'))['mode']; sys.exit(0 if m == 'live' else 'feed mode is ' + m + ', not live')"
      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          npx --yes wrangler@4.151.3 pages deploy site --project-name blackout --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true
